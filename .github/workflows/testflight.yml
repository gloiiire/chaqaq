name: TestFlight

# ── Triggers ─────────────────────────────────────────────────────────────────
#
# Une promotion vers `beta-test` livre aux testeurs. C'est ce que le nom de la
# branche promet, et jusqu'ici il ne le tenait pas : le déclencheur était
# manuel, donc promouvoir ne produisait rien et rien ne le disait.
#
# La pause avait une vraie raison, aujourd'hui périmée. Les runners macOS de
# GitHub embarquent Xcode 16 / SDK iOS 18 alors que pinkha cible iOS 26 —
# l'archivage échouait sur « iOS deployment target is set to 26.0, but the
# range of supported deployment target versions is 12.0 to 18.2.99 ». Le
# runner auto-hébergé porte Xcode 27 ; le job y tourne désormais.
#
# **Ce qui ne peut pas changer le binaire ne déclenche pas de livraison.**
# `paths-ignore` ne saute que si TOUS les fichiers touchés y figurent : un
# changement de documentation mêlé à du code livre quand même, ce qui est le
# comportement voulu. Sans ce garde, un correctif de CI promu jusqu'en haut
# consommerait une place de téléversement Apple — elles sont comptées par
# application, par plateforme et par jour. (Piège rapporté par la session
# ONTBibleApp, qui a perdu dix des onze places d'une journée le 2026-08-31.)
#
# `workflow_dispatch` reste, pour éprouver une modification de ce fichier seul.
on:
  push:
    branches: [beta-test]
    paths-ignore:
      - ".github/workflows/**"
      - "**/*.md"
      - "utilities/docs/**"
      # Outillage interne : ne produit pas une ligne du binaire.
      - "crates/pinkha-mcp/**"
  workflow_dispatch:

# ── Concurrency ──────────────────────────────────────────────────────────────
#
# Cancel any in-flight TestFlight build when a newer commit lands on
# beta-test. Two parallel uploads would race for the next build number
# (latest_testflight + 1) and the loser would get rejected by ASC.
# ── Concurrency ──────────────────────────────────────────────────────────────
#
# **Un seul groupe pour les deux workflows.** La ressource partagee est la
# fiche App Store Connect, pas le fichier : TestFlight et App Store se
# disputent le meme numero de build.
#
# `cancel-in-progress: false` — le second attend, il n'annule pas le premier.
# Annuler un televersement a mi-chemin ne laisse pas un etat propre : il peut
# avoir abouti cote Apple pendant que le job meurt cote GitHub. On aurait
# alors un build chez Apple que la CI croit inexistant, et le numero suivant
# entrerait en collision. (Regle et raison rapportees par la session
# ONTBibleApp, qui l'a mesuree.)
concurrency:
  group: apple-delivery
  cancel-in-progress: false

jobs:
  testflight:
    # macOS is mandatory : xcodebuild + signing only work on Apple's
    # toolchain. `macos-14` ships Xcode 16 by default — fastlane picks
    # it up automatically.
    # Runner auto-hébergé : c'est la seule machine qui porte Xcode 27, donc
    # le seul endroit où une cible iOS 26 s'archive. Contrepartie assumée,
    # identique au job Swift de `ci.yml` : machine éteinte = le job attend
    # puis expire, il ne livre pas une build fausse.
    runs-on: [self-hosted, macOS, ARM64, xcode27]

    # 30 min hard ceiling. A normal build finishes in ~15 min ; past
    # 30 min something is wedged and re-trying is cheaper than waiting.
    timeout-minutes: 30

    steps:
      # 1. Pull the code from the beta-test branch.
      - name: Checkout source
        uses: actions/checkout@v7
        # Fetch full history so `git describe` / changelog helpers can
        # see the commits, not just the latest one.
        with:
          fetch-depth: 0

      # 2. Pin the Xcode version. The macos-14 runner has several
      #    Xcodes installed ; this picks the one matching our minimum
      #    iOS SDK. Drop `xcode-version` to use whatever's default.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # 3. Ruby + Bundler. `bundler-cache: true` caches the gems
      #    install between runs so we don't re-download fastlane each
      #    time (saves ~1 minute per build).
      - name: Setup Ruby + bundler cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      # 4. The actual build + upload. Every ENV here mirrors what
      #    `fastlane/.env` carries locally — the lane code itself is
      #    environment-agnostic.
      - name: Build and upload to TestFlight
        env:
          # `ensure_git_branch` would fail on GitHub Actions because
          # the checkout is in detached-HEAD state, not on a named
          # branch. The lane respects this opt-out env var.
          SKIP_BRANCH_CHECK: "true"

          APP_STORE_CONNECT_API_KEY_ID:      ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID:   ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_CONNECT_API_KEY_BASE64:  "true"

          MATCH_PASSWORD:                ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}

          # fastlane sometimes prompts for the keychain password ;
          # we feed the runner's default to skip the interactive step.
          # On macos-14 runners the default keychain has no password
          # so the empty string is correct.
          MATCH_KEYCHAIN_NAME:     "fastlane_keychain"
          # Nom(s) du groupe TestFlight destinataire, tels qu'ils apparaissent
          # dans App Store Connect. Variable de depot (non secrete) plutot que
          # valeur en dur : le nom change sans toucher au code, et le lane
          # echoue bruyamment si elle est vide plutot que de livrer aux seuls
          # testeurs internes en silence.
          TESTFLIGHT_GROUPS:       ${{ vars.TESTFLIGHT_GROUPS }}
          MATCH_KEYCHAIN_PASSWORD: ""

          # Silence fastlane's metrics opt-in dialog on CI.
          FASTLANE_SKIP_UPDATE_CHECK: "true"
          FASTLANE_HIDE_CHANGELOG:    "true"
        run: bundle exec fastlane ios beta

      # 5. Upload the .ipa as a workflow artifact for inspection /
      #    re-upload, kept 7 days. Convenient when ASC drops a build.
      - name: Archive build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testflight-build
          path: |
            build/Pinkha.ipa
            build/*.dSYM.zip
          retention-days: 7
          if-no-files-found: ignore
