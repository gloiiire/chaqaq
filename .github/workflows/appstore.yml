name: App Store

# ── Triggers ─────────────────────────────────────────────────────────────────
#
# Pushes to `app-store` mean : beta-test has been validated, we're ready for
# the App Store. The build is uploaded as a candidate but NOT
# submitted for review — `upload_to_app_store(submit_for_review: false)`
# gives you a chance to fill in the release notes / screenshots in ASC
# before clicking "Submit" by hand.
# Manual-only for the same reason as testflight.yml — GHA runners
# don't have Xcode 26 yet. Until they do, App Store builds are
# produced locally via `bundle exec fastlane ios release` from the
# app-store branch. Flip back to `push: [app-store]` once Xcode 26 lands.
# **Ce qui ne peut pas changer le binaire ne déclenche pas de téléversement.**
# Voir l'explication détaillée dans `testflight.yml` : les places de
# téléversement Apple sont comptées par jour, et un correctif de CI promu
# jusqu'ici en consommerait une.
#
# Le build monte comme CANDIDAT — `submit_for_review: false`. La soumission à
# la revue reste un geste humain dans App Store Connect, et doit le rester :
# elle engage une version publique.
on:
  push:
    branches: [app-store]
    paths-ignore:
      - ".github/workflows/**"
      - "**/*.md"
      - "utilities/docs/**"
      # Outillage interne : ne produit pas une ligne du binaire.
      - "crates/pinkha-mcp/**"
  workflow_dispatch:

concurrency:
  group: apple-delivery
  cancel-in-progress: false

jobs:
  appstore:
    # Runner auto-hébergé : seule machine avec Xcode 27, donc seule capable
    # d'archiver une cible iOS 26.
    runs-on: [self-hosted, macOS, ARM64, xcode27]
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pas d'action de selection d'Xcode : le runner auto-hebergé n'en porte
      # qu'un, et `maxim-lobanov/setup-xcode@v1` avec `latest-stable` a fait
      # echouer la premiere livraison automatique — la machine suit les betas
      # d'Apple, donc son Xcode 27 est marque `stable: false` et le selecteur
      # ne trouvait rien. Le job Swift de `ci.yml` tourne sur la meme machine
      # sans selecteur ; on s'aligne.
      #
      # En contrepartie on VERIFIE, et on refuse de livrer si la version n'est
      # pas celle attendue. Un binaire televerse chez Apple doit avoir ete
      # construit avec un Xcode connu : sur une machine qui suit les betas,
      # « ce qui est la » change sans prevenir, y compris entre deux jobs de
      # la meme journee.
      - name: Xcode utilisable pour un televersement
        run: |
          # Apple REFUSE tout televersement d'un binaire construit avec un
          # Xcode de pre-version — TestFlight compris, y compris pour un
          # groupe interne. Mesure de la session ONTBibleApp le 2026-08-31 :
          #
          #   error: exportArchive This bundle is invalid. Apple is not
          #   currently accepting applications built with this version of Xcode.
          #
          # Le refus tombe APRES l'archive et l'export, donc apres plusieurs
          # minutes de compilation. Echouer ici coute quelques secondes et ne
          # consomme aucune place de televersement.
          #
          # Le critere porte sur le FAIT, pas sur le numero : epingler « 27.x »
          # ne protege de rien, puisque la 27.0 publiee portera le meme numero
          # que la graine d'aujourd'hui. Le suffixe en lettre minuscule du
          # numero de build (27A5218g) marque une pre-version ; une version
          # publiee n'en a pas. Critere grossier, assume comme tel.
          #
          # Pas de `| head` sur `xcodebuild` : la session ONTBibleApp a vu son
          # `xcodebuild` 27 avorter sur SIGPIPE (code 134). Non reproduit ici,
          # mais capturer la sortie entiere puis decouper ne coute rien.
          sortie="$(xcodebuild -version)"
          version="$(echo "$sortie" | sed -n '1s/Xcode //p')"
          build="$(echo "$sortie" | sed -n '2s/Build version //p')"
          echo "Xcode $version (build $build)"
          case "$build" in
            *[a-z])
              echo "::error::Xcode $version build $build est une pre-version."
              echo "Apple refuse les televersements construits avec une graine,"
              echo "TestFlight compris. Installer un Xcode publie avant de livrer."
              exit 1 ;;
            *)
              echo "✓ version publiee — televersement possible" ;;
          esac

      - name: Setup Ruby + bundler cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build and upload to App Store
        env:
          SKIP_BRANCH_CHECK: "true"

          APP_STORE_CONNECT_API_KEY_ID:      ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID:   ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          APP_STORE_CONNECT_API_KEY_BASE64:  "true"

          MATCH_PASSWORD:                ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}

          MATCH_KEYCHAIN_NAME:     "fastlane_keychain"
          MATCH_KEYCHAIN_PASSWORD: ""

          FASTLANE_SKIP_UPDATE_CHECK: "true"
          FASTLANE_HIDE_CHANGELOG:    "true"
        run: bundle exec fastlane ios release

      - name: Archive build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appstore-build
          path: |
            build/Pinkha.ipa
            build/*.dSYM.zip
          retention-days: 30
          if-no-files-found: ignore
