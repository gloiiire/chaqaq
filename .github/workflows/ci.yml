name: CI

on:
  push:
    branches: [master, staging, dev]
  pull_request:
    branches: [master, staging, dev]

# Annule les runs en cours quand un nouveau commit arrive sur la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: cargo clippy (warnings as errors)
        # Mirrors the pre-commit hook so contributors can catch the same
        # lints locally before push. Both gates are kept in lockstep — any
        # tightening here should be applied to scripts/hooks/pre-commit too.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Generated UniFFI bindings are up to date
        # Guards the failure mode that shipped a boot crash: a uniffi bump
        # changes the generated bindings, but the checked-in pinkha.swift is
        # not regenerated. The Rust scaffolding and the Swift bindings then
        # disagree on the API checksum and
        # `uniffiEnsurePinkhaInitialized()` calls `fatalError` on the first
        # `PinkhaApi` construction — i.e. at app launch, for every user.
        # Rust-only CI is blind to it, and a Cargo.toml-only Dependabot PR
        # doesn't even trip the pre-commit hook (it skips when no .rs is
        # staged).
        #
        # All three artefacts are diffed: build-xcframework.sh consumes the
        # .h and .modulemap, which drift on the same bump as the .swift.
        run: |
          set -euo pipefail
          cargo build --lib
          LIB=""
          for candidate in target/debug/libpinkha.so target/debug/libpinkha.dylib; do
            [ -f "$candidate" ] && LIB="$candidate" && break
          done
          [ -n "$LIB" ] || { echo "::error::no libpinkha cdylib found"; exit 1; }

          OUT="$(mktemp -d)"
          cargo run --quiet --bin uniffi-bindgen -- generate \
            --library "$LIB" --language swift --out-dir "$OUT"

          FAIL=0
          diff -u app/Packages/PinkhaFFI/Sources/PinkhaFFI/pinkha.swift "$OUT/pinkha.swift" || FAIL=1
          diff -u swift-bindings/pinkhaFFI.h "$OUT/pinkhaFFI.h" || FAIL=1
          diff -u swift-bindings/pinkhaFFI.modulemap "$OUT/pinkhaFFI.modulemap" || FAIL=1

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Generated UniFFI bindings are stale. Regenerate with:"
            echo "  cargo build && cargo run --bin uniffi-bindgen -- generate \\"
            echo "      --library target/debug/libpinkha.dylib --language swift --out-dir swift-bindings/"
            echo "  mv swift-bindings/pinkha.swift app/Packages/PinkhaFFI/Sources/PinkhaFFI/"
            exit 1
          fi
      - name: cargo test + coverage gate (89%)
        # Fails the build if line coverage drops below 89%. Tightening
        # back to 90% (and beyond to 95/98%) is on the books once the
        # sub-90% infrastructure files are properly covered :
        #   - migrations.rs (69%) : legacy rename + column-add paths
        #   - sqlite_shelf_store.rs (73%)
        #   - sqlite_leaf_store.rs (78%)
        # These were the limiting factor BEFORE the date-grouping PR ;
        # the gate was temporarily dropped to 89% in that PR to unblock
        # the TestFlight beta deploy. New code added by that PR
        # (date_grouped_query etc.) lands at 93-95% on its own.
        # Excluded paths (cannot be unit-tested without external fixtures
        # or live network):
        #   - binary entry points (main, bin/)
        #   - Notion HTTP client + serde-only schema types
        #   - Notion extractor pipeline (needs a live api.notion.com)
        #   - Notion FFI wrapper (Tokio + reqwest, network-bound)
        #   - Craft extractors (need real `.realm` / `.textbundle` files)
        #   - Bear extractor pipeline (needs Bear's SQLite database)
        #   - Repository trait definitions (book_repository.rs,
        #     shelf_repository.rs, repository.rs, unit_of_work.rs) :
        #     these are pure interfaces with no implementation logic,
        #     so coverage reports 0% by definition. Tests exercise the
        #     concrete impls in `infrastructure/`, which IS measured.
        #   - no_op_unit_of_work.rs : test-only harness wrapping the
        #     repositories ; measuring coverage of test infrastructure
        #     itself isn't meaningful.
        #   - pinkha-mcp main.rs : stdio JSON-RPC loop, same shape as
        #     src/bin/* — the testable surface (registry, dispatch,
        #     protocol envelope) lives in tools.rs / protocol.rs
        #     which ARE covered by tests/dispatch.rs + tests/protocol.rs.
        run: |
          cargo llvm-cov --workspace --summary-only --fail-under-lines 89 \
            --ignore-filename-regex '(src/main\.rs|src/bin/.*|src/extractors/mod\.rs|src/extractors/notion/.*|src/extractors/craft/.*|src/extractors/craft_combined/.*|src/extractors/craft_textbundle/.*|src/extractors/bear/mod\.rs|src/extractors/bear/reader\.rs|src/ffi/extractors\.rs|src/application/book_repository\.rs|src/application/shelf_repository\.rs|src/application/repository\.rs|src/application/unit_of_work\.rs|src/infrastructure/no_op_unit_of_work\.rs|crates/pinkha-mcp/src/main\.rs)'

  audit:
    name: Cargo audit (CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Run cargo audit
        # Fails the build if any known vulnerability is found in the dependency
        # tree. Dependabot covers GitHub-side scanning; this catches CVEs at PR
        # time before merge.
        run: cargo audit --deny warnings

  # Tests Swift sur runner self-hosted.
  #
  # Les runners GitHub (`macos-15`) n'ont que Xcode 16.4 / iOS 18.5 SDK, alors
  # que le projet cible iOS 26 et utilise `UIGlassEffect` / `.glassEffect()`.
  # Plutôt que d'attendre Xcode 26 sur les runners hébergés, on exécute ce job
  # sur la machine de dev, qui a le bon Xcode et le simulateur "Pinkha SIM".
  #
  # `xcode27` est un label custom : quand la machine est éteinte, le job reste
  # en attente puis expire au timeout au lieu de bloquer la PR indéfiniment.
  swift:
    name: Swift tests (self-hosted, Xcode 27)
    runs-on: [self-hosted, macOS, ARM64, xcode27]
    # Un job en attente sur un runner offline resterait pendu sans ça.
    timeout-minutes: 45
    # NE JAMAIS exécuter le code d'un fork sur une machine personnelle. Le repo
    # est public et les forks sont autorisés : sans cette garde, n'importe qui
    # pourrait faire tourner du code arbitraire sur le Mac via une PR. Les
    # contributeurs externes restent couverts par le job Rust ; leur code Swift
    # se teste en poussant la branche dans ce dépôt.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      - name: Environnement
        # Le service tourne en LaunchAgent : son PATH vient du fichier `.env`
        # à la racine du runner, pas du shell interactif. Si un outil manque
        # ici, c'est `.env` qu'il faut corriger, pas le workflow.
        run: |
          echo "Xcode    : $(xcodebuild -version | head -1)"
          echo "Swift    : $(swift --version 2>&1 | head -1)"
          echo "xcodegen : $(xcodegen --version 2>&1 | head -1)"
          echo "cargo    : $(cargo --version 2>&1)"

      - name: Purge des copies de conflit iCloud
        # Le repo de dev vit dans iCloud, qui fabrique des "Foo 2.swift".
        # Le checkout du runner est propre, mais xcodegen lit `app/` et un
        # doublon ferait échouer le build de façon incompréhensible.
        run: |
          find app -name "* [2-9].swift" -delete 2>/dev/null || true
          find app -name "* [2-9].xcodeproj" -type d -exec rm -rf {} + 2>/dev/null || true

      - name: Build du xcframework Rust
        # Le xcframework est gitignored et reconstruit à la demande — les
        # tests Swift ne compilent pas sans lui.
        run: ./build-xcframework.sh

      - name: Génération du projet Xcode
        run: |
          cd app && xcodegen generate
          cd .. && ./utilities/scripts/patch-app-icon.rb

      - name: Simulateur
        id: sim
        # Résolu par nom, comme les scripts locaux. `bootstatus -b` bloque
        # jusqu'à ce qu'il soit réellement utilisable, ce qui évite la course
        # "Unable to lookup in current state: Shutdown" au démarrage à froid.
        run: |
          UDID=$(xcrun simctl list devices --json \
            | jq -r '.devices | to_entries[] | .value[] | select(.name == "Pinkha SIM") | .udid' \
            | head -1)
          if [ -z "$UDID" ]; then
            echo "::error::simulateur 'Pinkha SIM' introuvable sur ce runner"
            exit 1
          fi
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b >/dev/null 2>&1 || true
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Tests unitaires + intégration
        # Les XCUITest sont volontairement exclus : ils exigent une session
        # graphique connectée, alors que le runner tourne en LaunchAgent.
        # Ils restent lancés à la main via utilities/scripts.
        run: |
          set -o pipefail
          ARGS=(test
            -project app/Pinkha.xcodeproj
            -scheme Pinkha
            -destination "id=${{ steps.sim.outputs.udid }}"
            -only-testing:PinkhaTests
            -only-testing:PinkhaIntegrationTests)
          # xcpretty n'est que du confort de lecture : s'il n'est pas là, on
          # ne fait pas échouer la CI pour autant. `pipefail` garantit que le
          # code de sortie reste celui de xcodebuild, pas celui du filtre.
          if command -v xcpretty >/dev/null 2>&1; then
            xcodebuild "${ARGS[@]}" | xcpretty
          else
            xcodebuild "${ARGS[@]}"
          fi
