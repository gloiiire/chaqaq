name: Chaqaq
options:
  bundleIdPrefix: com.gloiiire
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

schemes:
  Chaqaq:
    build:
      targets:
        Chaqaq: all
        ChaqaqTests: test
        ChaqaqIntegrationTests: test
        ChaqaqUITests: test
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ChaqaqTests
        - ChaqaqIntegrationTests
        - ChaqaqUITests
    archive:
      config: Release

targets:
  Chaqaq:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
      - path: ../swift-bindings/chaqaq.swift
    resources:
      - path: Sources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gloiiire.chaqaq
        INFOPLIST_FILE: Sources/Info.plist
        SWIFT_VERSION: "5.0"
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        OTHER_LDFLAGS: "$(inherited) -lc++"
    dependencies:
      - framework: ../chaqaq.xcframework
        embed: false

  # Tests unitaires : code Swift pur (modèles Codable, helpers, extensions).
  ChaqaqTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/Unit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gloiiire.chaqaq.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Chaqaq

  # Tests d'intégration : Swift ↔ FFI Rust (création doc, round-trip JSON, erreurs).
  ChaqaqIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/Integration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gloiiire.chaqaq.integration
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Chaqaq

  # Tests E2E (UI XCUITest) : pilote l'app comme un utilisateur (tap, swipe…).
  ChaqaqUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/UI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gloiiire.chaqaq.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Chaqaq
