name: Pinkha
options:
  bundleIdPrefix: com.gloiiire
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

# Project-wide build settings. Apply to every target unless overridden.
settings:
  base:
    # Apple Silicon Macs run iOS Simulator natively (arm64). Excluding x86_64
    # avoids dragging in a slice the toolchain can't link against — and keeps
    # the test targets in lockstep with the main app.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "8.49.0"
  PinkhaFFI:
    path: Packages/PinkhaFFI
  PinkhaCore:
    path: Packages/PinkhaCore
  PinkhaDesignSystem:
    path: Packages/PinkhaDesignSystem
  PinkhaRichText:
    path: Packages/PinkhaRichText
  PinkhaComposer:
    path: Packages/PinkhaComposer
  PinkhaFeatures:
    path: Packages/PinkhaFeatures

schemes:
  Pinkha:
    build:
      targets:
        Pinkha: all
        PinkhaTests: test
        PinkhaIntegrationTests: test
        PinkhaUITests: test
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PinkhaTests
        - PinkhaIntegrationTests
        - PinkhaUITests
    archive:
      config: Release

targets:
  Pinkha:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    sources:
      - path: Sources
        excludes:
          # iCloud Drive conflict copies ("Foo 2.swift", "Foo 3.swift") must
          # never enter the build — they're not real source files.
          - "**/* [2-9].swift"
    resources:
      # The app icon is an Icon Composer bundle (Xcode 26) living at
      # app/Pinkha.icon — NOT inside Assets.xcassets. AppIcon.appiconset
      # there is an intentionally empty fallback. xcodegen cannot register
      # .icon bundles nor set ASSETCATALOG_COMPILER_APPICON_NAME, so every
      # `xcodegen generate` MUST be followed by ./scripts/patch-app-icon.rb
      # (run-on-device.sh runs it automatically) — otherwise the built app
      # ships the blank placeholder icon.
      - path: Sources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gloiiire.pinkha
        INFOPLIST_FILE: Sources/Info.plist
        SWIFT_VERSION: "5.0"
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        OTHER_LDFLAGS: "$(inherited) -lc++"
        DEVELOPMENT_TEAM: N49VNC2G57
      configs:
        Debug:
          # Required so test targets can `@testable import Pinkha`.
          ENABLE_TESTABILITY: YES
    dependencies:
      - package: PinkhaFFI
        product: PinkhaFFI
      - package: PinkhaCore
        product: PinkhaCore
      - package: PinkhaDesignSystem
        product: PinkhaDesignSystem
      - package: PinkhaRichText
        product: PinkhaRichText
      - package: PinkhaComposer
        product: PinkhaComposer
      - package: PinkhaFeatures
        product: LeafFeature
      - package: PinkhaFeatures
        product: BookFeature
      - package: PinkhaFeatures
        product: LibraryFeature
      - package: PinkhaFeatures
        product: ImportFeature
      - package: Sentry
        product: Sentry

  # Tests unitaires : code Swift pur (modèles Codable, helpers, extensions).
  PinkhaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/Unit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gloiiire.pinkha.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: N49VNC2G57
    dependencies:
      - target: Pinkha

  # Tests d'intégration : Swift ↔ FFI Rust (création doc, round-trip JSON, erreurs).
  PinkhaIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/Integration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gloiiire.pinkha.integration
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: N49VNC2G57
    dependencies:
      - target: Pinkha

  # Tests E2E (UI XCUITest) : pilote l'app comme un utilisateur (tap, swipe…).
  PinkhaUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/UI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gloiiire.pinkha.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: N49VNC2G57
    dependencies:
      - target: Pinkha
