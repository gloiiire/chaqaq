name: Pinkha
options:
  bundleIdPrefix: com.gloiiire
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

schemes:
  Pinkha:
    build:
      targets:
        Pinkha: all
        PinkhaTests: test
        PinkhaIntegrationTests: test
        PinkhaUITests: test
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PinkhaTests
        - PinkhaIntegrationTests
        - PinkhaUITests
    archive:
      config: Release

targets:
  Pinkha:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
      - path: ../swift-bindings/pinkha.swift
    resources:
      - path: Sources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gloiiire.pinkha
        INFOPLIST_FILE: Sources/Info.plist
        SWIFT_VERSION: "5.0"
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        OTHER_LDFLAGS: "$(inherited) -lc++"
    dependencies:
      - framework: ../pinkha.xcframework
        embed: false

  # Tests unitaires : code Swift pur (modèles Codable, helpers, extensions).
  PinkhaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/Unit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gloiiire.pinkha.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Pinkha

  # Tests d'intégration : Swift ↔ FFI Rust (création doc, round-trip JSON, erreurs).
  PinkhaIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/Integration
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gloiiire.pinkha.integration
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Pinkha

  # Tests E2E (UI XCUITest) : pilote l'app comme un utilisateur (tap, swipe…).
  PinkhaUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/UI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gloiiire.pinkha.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Pinkha
