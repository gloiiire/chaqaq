[workspace]
members = [".", "crates/chaqaq", "crates/realm-codec", "crates/pinkha-mcp"]
resolver = "2"

[package]
name = "pinkha"
version = "0.1.0"
edition = "2024"

[lib]
name = "pinkha"
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
chaqaq = { path = "crates/chaqaq" }
realm-codec = { path = "crates/realm-codec" }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.31", features = ["bundled"] }
rusqlite_migration = "1.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "time"] }
# Ordered concurrent page fetches during imports (`stream::buffered`).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
uniffi = { version = "0.31", features = ["cli"] }
uuid = { version = "1.23.2", features = ["serde", "v4"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[build-dependencies]
uniffi = { version = "0.31", features = ["build"] }
