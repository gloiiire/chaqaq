[package]
name = "pinkha-mcp"
version = "0.1.0"
edition = "2024"
description = "Model Context Protocol server exposing a local pinkha SQLite store to AI agents."
license = "MIT OR Apache-2.0"

[[bin]]
name = "pinkha-mcp"
path = "src/main.rs"

[dependencies]
pinkha = { path = "../.." }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
anyhow = "1.0"
